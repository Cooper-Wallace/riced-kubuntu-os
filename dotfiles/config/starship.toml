# Starship Prompt Configuration for RKO
# High-contrast, aesthetic, responsive prompt

add_newline = true
scan_timeout = 10

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time
$character"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

[fill]
symbol = " "

[time]
disabled = false
time_format = "%R"
style = "dimmed white"
format = "[$time]($style)"
